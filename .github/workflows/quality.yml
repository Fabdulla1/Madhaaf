name: Quality

on:
  push:
    branches: [main, feat/kutchi-roots-foundation]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_kutchi_*_import.py'
      - run: python -m unittest discover -s tests -p 'test_family_*_import.py'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx playwright test --config tests/media-ui/playwright.config.ts

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610190001_foundation.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610190002_lexeme_preferred_form.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610190003_public_family_tree.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610200001_dictionary_linguistics.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610210001_dictionary_attestations.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610210002_dictionary_example_provenance.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610210003_published_example_sources.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610210004_dictionary_crosslink_update_guard.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610210005_family_sibling_kind.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610210006_family_sibling_connections.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610220001_video_media_kind.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/media_legacy_before.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610220002_private_media_library.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610220003_private_media_grants.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/media_legacy_after.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/foundation.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/public_family.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/family_siblings.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/dictionary_entry.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/dictionary_attestations.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/security_roles.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/media_library.sql
